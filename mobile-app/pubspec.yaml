name: pitchup_app
description: A new Flutter project for PitchUp
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  animations: ^2.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_spinkit: ^5.2.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  share_plus: ^13.3.0
  smooth_page_indicator: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
